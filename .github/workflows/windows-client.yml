name: Windows-Client bauen

# Ein Tag wie "client-v0.1.0" baut ArchivImporter.exe und hängt sie an ein Release.
# Der Begleitdienst holt sie dann über "Von GitHub holen" auf der Download-Seite.
on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Version setzen
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^client-v', ''
          if ($v -eq "${{ github.ref_name }}") { $v = "0.0.0-${{ github.run_number }}" }
          "__version__ = `"$v`"" | Out-File -Encoding utf8 archiv_importer\_version.py
      - name: Bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name ArchivImporter
          --paths ..\begleitdienst
          --add-data "archiv_importer\static;archiv_importer\static"
          --collect-submodules uvicorn --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-submodules archiv_core --hidden-import archiv_core
          start.py
      - name: Startprobe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ArchivImporter.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Startprobe fehlgeschlagen: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ArchivImporter
          path: windows-client/dist/ArchivImporter.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-client/dist/ArchivImporter.exe
