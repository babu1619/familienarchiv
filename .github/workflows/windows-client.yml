name: Windows-Client bauen

# Jede Änderung am Client auf main baut ArchivImporter.exe und legt ein Release
# "client-v<Version>" an (Version aus windows-client/VERSION). Neue Version = VERSION erhöhen.
# Der Begleitdienst holt die .exe über "Von GitHub holen" auf der Download-Seite.
on:
  push:
    branches: [main]
    tags: ["client-v*"]
    paths:
      - "windows-client/**"
      - "begleitdienst/archiv_core/**"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Version setzen
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/client-v")) { $v = "${{ github.ref_name }}" -replace '^client-v', '' }
          else { $v = (Get-Content VERSION -Raw).Trim() }
          "__version__ = `"$v`"" | Out-File -Encoding utf8 archiv_importer\_version.py
          "v=$v" >> $env:GITHUB_OUTPUT
      - name: Bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name ArchivImporter
          --paths ..\begleitdienst
          --add-data "archiv_importer\static;archiv_importer\static"
          --collect-submodules uvicorn --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-submodules archiv_core --hidden-import archiv_core
          start.py
      - name: Startprobe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ArchivImporter.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Startprobe fehlgeschlagen: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ArchivImporter
          path: windows-client/dist/ArchivImporter.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-v${{ steps.version.outputs.v }}
          name: Windows-Client ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: windows-client/dist/ArchivImporter.exe
