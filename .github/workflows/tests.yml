name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Abhängigkeiten
        run: |
          python -m pip install -r begleitdienst/requirements.txt
          python -m pip install pypdfium2 pytesseract pillow reportlab
      - name: Tests
        working-directory: tests
        run: python -m unittest discover -v
